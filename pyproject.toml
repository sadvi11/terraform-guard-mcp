[project]
name = "terraform-guard-mcp"
# Matches the v1.0.0 release already published on GitHub. These had drifted:
# the tag said 1.0.0 and this said 0.1.0, which would have put a 0.1.0 on PyPI
# for a project whose own release page advertises 1.0.0 - and a PyPI version
# can never be reused or corrected afterwards.
version = "1.0.0"
description = "MCP server that inspects Terraform plans and refuses to bless dangerous ones"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sadhvi Sharma", email = "sadhvisharma763@gmail.com"}]
keywords = [
    "terraform", "mcp", "model-context-protocol", "infrastructure-as-code",
    "devsecops", "guardrails", "policy-as-code", "aws",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["mcp[cli]>=2.0"]

[project.urls]
Homepage = "https://github.com/sadvi11/terraform-guard-mcp"
Source = "https://github.com/sadvi11/terraform-guard-mcp"
Issues = "https://github.com/sadvi11/terraform-guard-mcp/issues"
Changelog = "https://github.com/sadvi11/terraform-guard-mcp/releases"

[project.optional-dependencies]
test = ["pytest>=8.0"]

# plans/ sits next to tfguard/, and setuptools auto-discovery refuses to
# guess between two top-level directories. Naming the package explicitly is
# the fix - and this only showed up in CI, because locally I had been
# running with PYTHONPATH and never actually installed it.
[tool.setuptools]
packages = ["tfguard"]

[project.scripts]
terraform-guard-mcp = "tfguard.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
